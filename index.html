<title>토너먼트 시간표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: departure-board list — controls on top, one dense row per tournament, sorted from "now" */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --fg:#1b2420; --muted:#66716b; --line:#dde3de;
  --accent:#1f6b52; --accent-soft:#e1efe8;
  --wpl:#2b5fa8; --wpl-soft:#e4ecf7; --hg:#b0620e; --hg-soft:#f8ecdd;
  --live:#c2392b; --live-soft:#fbe6e2; --star:#c98a00;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --panel:#1a221e; --fg:#e4ebe6; --muted:#93a19a; --line:#2b3631;
  --accent:#5fc49c; --accent-soft:#1f3a2f;
  --wpl:#7fa8e6; --wpl-soft:#1f2c40; --hg:#e8a256; --hg-soft:#3a2a17;
  --live:#f07b6c; --live-soft:#3d201c; --star:#f2c14e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --panel:#1a221e; --fg:#e4ebe6; --muted:#93a19a; --line:#2b3631;
  --accent:#5fc49c; --accent-soft:#1f3a2f;
  --wpl:#7fa8e6; --wpl-soft:#1f2c40; --hg:#e8a256; --hg-soft:#3a2a17;
  --live:#f07b6c; --live-soft:#3d201c; --star:#f2c14e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.hright{display:flex;align-items:flex-end;gap:14px}
.theme{font-size:12px;padding:4px 10px;align-self:center}
.clock{font-family:var(--mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
.clock small{display:block;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--muted);margin-top:4px;text-align:right}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lab{font-size:11px;letter-spacing:.06em;color:var(--muted);width:64px;flex-shrink:0;font-weight:500}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=search]{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input[type=search]{flex:1;min-width:0;max-width:240px}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.summary b{color:var(--fg);font-family:var(--mono);font-variant-numeric:tabular-nums}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:84px 64px minmax(0,1fr) 88px 96px 132px;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:500;padding-block:8px;background:var(--bg)}
.row.live{background:var(--live-soft)}
.t{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.star{appearance:none;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:2px 3px;cursor:pointer;border-radius:4px}
.star:hover{color:var(--fg);background:var(--bg)}
.star[aria-pressed="true"]{color:var(--star)}
.star:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.site{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;justify-self:start}
.site.WPL{color:var(--wpl);background:var(--wpl-soft)}
.site.한게임{color:var(--hg);background:var(--hg-soft)}
.name{min-width:0}
.name .n{font-weight:500;overflow-wrap:anywhere}
.name .sub{font-size:12px;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.num small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted)}
.st{font-size:12px;text-align:right}
.st .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:500}
.st .pill.live{color:var(--live);border:1px solid var(--live)}
.st .pill.soon{color:var(--accent);background:var(--accent-soft)}
.st .pill.later{color:var(--muted)}
.st small{display:block;color:var(--muted);font-size:11px;margin-top:2px;font-family:var(--mono)}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
footer{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
@media (max-width:680px){
  .row{grid-template-columns:78px minmax(0,1fr) auto;grid-template-areas:"t name st" "t num num";row-gap:4px}
  .row.head{display:none}
  .row .t{grid-area:t;align-self:start}
  .row .site{display:none}
  .row .name{grid-area:name}
  .row .st{grid-area:st;align-self:start}
  .row .numwrap{grid-area:num;display:flex;gap:14px;justify-content:flex-start}
  .row .num{text-align:left}
  .name .tag{display:inline}
}
@media (min-width:681px){.row .numwrap{display:contents}.name .tag{display:none}}
.tag{font-size:11px;font-weight:700;margin-right:6px}
.tag.WPL{color:var(--wpl)} .tag.한게임{color:var(--hg)}
@media (prefers-reduced-motion:no-preference){.row.live .pill.live{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.55}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>토너먼트 시간표</h1>
      <div class="summary" id="sum"></div>
    </div>
    <div class="hright">
      <button class="chip theme" id="f-theme" aria-label="화면 테마 바꾸기">시스템</button>
      <div class="clock" id="clock">--:--<small>한국 시간</small></div>
    </div>
  </header>

  <section class="controls" aria-label="필터">
    <div class="crow"><span class="lab">사이트</span><span id="f-site"></span></div>
    <div class="crow"><span class="lab">단위</span><span id="f-unit"></span></div>
    <div class="crow"><span class="lab">바이인</span><span id="f-band"></span></div>
    <div class="crow"><span class="lab">형식</span><span id="f-fmt"></span></div>
    <div class="crow"><span class="lab">보기</span>
      <button class="chip" id="f-open" aria-pressed="false">지금 들어갈 수 있는 것만</button>
      <button class="chip" id="f-fav" aria-pressed="false">★ 즐겨찾기만</button>
      <select id="f-sort" aria-label="정렬">
        <option value="now">지금부터 시간순</option>
        <option value="clock">0시부터 시간순</option>
        <option value="buyin">바이인 낮은순</option>
        <option value="gtd">GTD 큰순</option>
      </select>
      <input type="search" id="f-q" placeholder="이름 검색 (예: 루키즈)" aria-label="이름 검색">
    </div>
  </section>

  <div class="list" id="list" role="table"></div>

  <footer>
    <div>환율: WPL·피망 1억 코인 = 1만 원, 한게임 50억 코인 = 1만 원. 단위를 바꾸면 모든 금액이 그 기준으로 환산돼요.</div>
    <div>늦은 등록 마감: 한게임은 시작 + 블라인드(분) × 레벨 + 지나가는 휴식(매시 55~00분) 5분씩, WPL은 시작 + 게임 안내 늦은 등록 시간(분).</div>
    <div>한게임 목록은 2026-10-04(일) 기준이며 이후 변경될 수 있음. HPT 새틀라이트 제외.</div>
  </footer>
</div>

applyTheme();

const BANDS=[["b0",0,0],["b1",1,100],["b2",101,1000],["b3",1001,5000],["b4",5001,10000],["b5",10001,30000],["b6",30001,1e12]];
const UNITS={"현금":0,"WPL 코인":10000,"한게임 코인":500000};
const SITES=["WPL","한게임"], FMTS=["터보","바운티","일반"];
const S={site:new Set(),band:new Set(),fmt:new Set(),open:false,sort:"now",q:"",unit:"현금",favOnly:false};
let FAV=new Set();try{FAV=new Set(JSON.parse(localStorage.getItem("lobby-fav")||"[]"))}catch(e){}
function saveFav(){try{localStorage.setItem("lobby-fav",JSON.stringify([...FAV]))}catch(e){}}
const keyOf=r=>r[0]+"|"+r[1]+"|"+r[7];
try{const s=JSON.parse(localStorage.getItem("lobby-f")||"null");if(s){S.site=new Set(s.site);S.band=new Set(s.band);S.fmt=new Set(s.fmt);S.open=!!s.open;S.sort=s.sort||"now";if(s.unit in UNITS)S.unit=s.unit;S.favOnly=!!s.favOnly;S.band=new Set([...S.band].filter(k=>/^b\d$/.test(k)))}}catch(e){}
function save(){try{localStorage.setItem("lobby-f",JSON.stringify({site:[...S.site],band:[...S.band],fmt:[...S.fmt],open:S.open,sort:S.sort,unit:S.unit,favOnly:S.favOnly}))}catch(e){}}

const won=n=>n>=10000?(n%10000?(n/10000).toFixed(1).replace(/\.0$/,""):n/10000)+"만원":n.toLocaleString("ko-KR")+"원";
const coin=n=>{if(!n)return"무료";if(n>=1e12)return(n/1e12)+"조";if(n>=1e8)return(+(n/1e8).toFixed(1))+"억";return(n/1e4)+"만"};
const money=w=>{const r=UNITS[S.unit];return !w?"무료":r?coin(w*r):won(w)};
const moneyShort=w=>{const r=UNITS[S.unit];return r?coin(w*r):(w>=10000?w/10000+"만원":w>=1000?w/1000+"천원":w+"원")};
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const dur=m=>m>=60?Math.floor(m/60)+"시간 "+(m%60?m%60+"분":""):m+"분";

function chips(id,arr,set){
  const el=document.getElementById(id);el.innerHTML="";
  arr.forEach(v=>{const b=document.createElement("button");b.className="chip";b.textContent=v;b.setAttribute("aria-pressed",set.has(v));
    b.onclick=()=>{set.has(v)?set.delete(v):set.add(v);b.setAttribute("aria-pressed",set.has(v));save();render()};el.append(b);el.append(" ")});
}
chips("f-site",SITES,S.site);chips("f-fmt",FMTS,S.fmt);
function bandLabel(i){const b=BANDS[i];if(i===0)return"무료";if(i===1)return"~"+moneyShort(100);if(i===BANDS.length-1)return moneyShort(30000)+" 초과";return moneyShort(BANDS[i-1][2])+"~"+moneyShort(b[2])}
function bandChips(){const el=document.getElementById("f-band");el.innerHTML="";
  BANDS.forEach((b,i)=>{const k=b[0],x=document.createElement("button");x.className="chip";x.textContent=bandLabel(i);x.setAttribute("aria-pressed",S.band.has(k));
    x.onclick=()=>{S.band.has(k)?S.band.delete(k):S.band.add(k);x.setAttribute("aria-pressed",S.band.has(k));save();render()};el.append(x," ")})}
function unitChips(){const el=document.getElementById("f-unit");el.innerHTML="";
  Object.keys(UNITS).forEach(u=>{const x=document.createElement("button");x.className="chip";x.textContent=u;x.setAttribute("aria-pressed",S.unit===u);
    x.onclick=()=>{S.unit=u;save();unitChips();bandChips();render()};el.append(x," ")})}
unitChips();bandChips();
const fo=document.getElementById("f-open");fo.setAttribute("aria-pressed",S.open);fo.onclick=()=>{S.open=!S.open;fo.setAttribute("aria-pressed",S.open);save();render()};
const ff=document.getElementById("f-fav");ff.setAttribute("aria-pressed",S.favOnly);ff.onclick=()=>{S.favOnly=!S.favOnly;ff.setAttribute("aria-pressed",S.favOnly);save();render()};
document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest(".star");if(!b)return;const k=decodeURIComponent(b.dataset.k);FAV.has(k)?FAV.delete(k):FAV.add(k);saveFav();render()});
const fs=document.getElementById("f-sort");fs.value=S.sort;fs.onchange=()=>{S.sort=fs.value;save();render()};
document.getElementById("f-q").oninput=e=>{S.q=e.target.value.trim();render()};

function kst(){const d=new Date(Date.now()+9*3600e3);return{min:d.getUTCHours()*60+d.getUTCMinutes(),sec:d.getUTCSeconds(),dow:d.getUTCDay()}}
const isWeekend=d=>d===0||d===6;

function render(){
  const k=kst(),now=k.min;
  document.getElementById("clock").firstChild.nodeValue=hm(now);
  const out=[];let liveN=0;
  for(const r of D){
    const [site,name,kind,fmt,cn,w,g,st,late]=r,day=r[11];
    const until=(st-now+1440)%1440, elapsed=(now-st+1440)%1440;
    const lateLen=late==null?0:(late-st+1440)%1440;
    const live=lateLen>0&&elapsed<lateLen;
    // which calendar day does this run start on (for 평일/주말 only)
    const dow=live?(st<=now?k.dow:(k.dow+6)%7):(st+0>=now?k.dow:(k.dow+1)%7);
    if(day==="평일"&&isWeekend(dow))continue;
    if(day==="주말"&&!isWeekend(dow))continue;
    if(S.site.size&&!S.site.has(site))continue;
    if(S.band.size&&!BANDS.some(b=>S.band.has(b[0])&&w>=b[1]&&w<=b[2]))continue;
    if(S.fmt.size&&![...S.fmt].some(f=>f==="일반"?fmt==="일반":fmt.includes(f)))continue;
    if(S.q&&!name.includes(S.q)&&!kind.includes(S.q))continue;
    if(S.open&&!live&&until>0)continue;
    if(S.favOnly&&!FAV.has(keyOf(r)))continue;
    if(live)liveN++;
    out.push({r,until,live,left:lateLen-elapsed});
  }
  const key={now:o=>o.live?-1e4+o.left:o.until,clock:o=>o.r[7],buyin:o=>o.r[5]*1e4+o.until,gtd:o=>-o.r[6]*1e4+o.until}[S.sort];
  out.sort((a,b)=>key(a)-key(b));
  document.getElementById("sum").innerHTML=`<span>표시 <b>${out.length}</b>개</span><span>늦은 등록 중 <b>${liveN}</b>개</span>`;
  const L=document.getElementById("list");
  if(!out.length){L.innerHTML=`<div class="empty">${S.favOnly&&!FAV.size?"즐겨찾기한 토너먼트가 없어요. 시간 옆 ★를 눌러 추가하세요.":"조건에 맞는 토너먼트가 없어요. 필터를 줄여 보세요."}</div>`;return}
  let h='<div class="row head" role="row"><span>시작</span><span>사이트</span><span>토너먼트</span><span class="num">바이인</span><span class="num">GTD</span><span class="st">상태</span></div>';
  for(const o of out){
    const [site,name,kind,fmt,cn,w,g,st,late,blind,lv,day]=o.r;
    let stat;
    if(o.live)stat=`<span class="pill live">늦은 등록 중</span><small>${hm(late)} 마감 · ${dur(o.left)} 남음</small>`;
    else if(o.until===0)stat=`<span class="pill soon">지금 시작</span>`;
    else stat=`<span class="pill ${o.until<=60?"soon":"later"}">${dur(o.until)} 후</span>${late!=null?`<small>${hm(late)} 마감</small>`:""}`;
    h+=`<div class="row${o.live?" live":""}" role="row"><span class="t"><button class="star" data-k="${encodeURIComponent(keyOf(o.r))}" aria-pressed="${FAV.has(keyOf(o.r))}" aria-label="${name} 즐겨찾기">${FAV.has(keyOf(o.r))?"★":"☆"}</button>${hm(st)}</span><span class="site ${site}">${site}</span>
      <span class="name"><span class="n"><span class="tag ${site}">${site}</span>${name}</span></span>
      <span class="numwrap"><span class="num">${money(w)}<small>${S.unit==="현금"?(cn?site+" "+coin(cn):"무료"):(w?won(w):"0원")}</small></span><span class="num">${money(g)}<small>GTD${S.unit==="현금"?"":" · "+won(g)}</small></span></span>
      <span class="st">${stat}</span></div>`;
  }
  L.innerHTML=h;
}
render();setInterval(render,20000);
</script>
